name = "hiring-signals-api"
main = "src/index.ts"
compatibility_date = "2026-07-26"
account_id = "c62f54368e3f6a1f503afa434771b7e4"
compatibility_flags = ["nodejs_compat"]
# Deploy to workers.dev by default (account subdomain is "teycircoder14",
# claimed 2026-07-29, one per account — final URL:
#   https://hiring-signals-api.teycircoder14.workers.dev
# To deploy to a custom domain instead, add `domains = ["..."]` below
# and remove this line.
workers_dev = true

# --- D1: canonical relational store (companies, sources, jobs, signals) ---
[[d1_databases]]
binding = "DB"
database_name = "hiring-signals"
database_id = "1b1d1f22-62de-4e59-95f5-e852c1a0c445"
migrations_dir = "../../infrastructure/d1/migrations"

# --- CI environment: isolated D1 database for the live-D1 test suites
# that touch ONLY D1 (packages/db/test/*.test.ts's createLiveD1Client
# callers, plus apps/api/test/jobs/{reconciliation,scheduler}.test.ts's
# createLiveD1Database callers -- confirmed by grepping every live-D1
# test file's @hiring-signals/test-support import, 2026-08-05: exactly
# these 9 files import only createLiveD1Client/createLiveD1Database,
# nothing else from that package).
#
# `binding = "DB"` deliberately matches the top-level binding name (not
# wrangler's own auto-suggested "hiring_signals_ci") so createD1Client()
# and every packages/db repo function work completely unmodified under
# either environment -- only which physical database `env.DB`/the
# D1Client passed to a repo function resolves to differs.
#
# `env.ci.vars`/`[ai]`/`[[vectorize]]`/`[[kv_namespaces]]` are
# deliberately NOT added here: per Cloudflare's own docs, bindings are
# non-inheritable per environment and must be redeclared explicitly, and
# these 9 files' handlers/repo functions never read env.AI, env.VECTORIZE,
# or any KV binding (confirmed by the same import-grep above) -- adding
# unused bindings here would be dead config, not real isolation of
# anything these tests touch. apps/api/test/jobs/ingest-consumer.test.ts
# is the one live-D1 file that DOES touch AI/Vectorize/KV (via
# createLiveAiBinding/createLiveVectorizeIndex/createLiveKvNamespace,
# packages/test-support/src/live-cf-bindings.ts) -- and those three
# helpers hit Cloudflare's REST API directly with hardcoded
# account-level resource names/ids, entirely bypassing wrangler.toml, so
# there is no config-based isolation path for them at all (Workers AI
# has no per-database concept to isolate in the first place; Vectorize's
# index name and every KV namespace id are hardcoded constants in that
# file, not read from any binding). That file is deliberately excluded
# from CI's live-D1 job below and stays manual-only, matching this
# repo's decision (2026-08-05) not to run it against production
# AI/Vectorize/KV data on every push.
#
# Provisioned 2026-08-05:
#   npx wrangler d1 create hiring-signals-ci
#   npx wrangler d1 migrations apply hiring-signals-ci --remote
[env.ci]
[[env.ci.d1_databases]]
binding = "DB"
database_name = "hiring-signals-ci"
database_id = "b1b02fb1-a493-4a7a-8ece-f3763ded98cf"
migrations_dir = "../../infrastructure/d1/migrations"

# --- KV: ephemeral shared cache (facets, rate-limit counters, abuse logs)
# Stored separately from raw payloads (below) to limit blast radius:
# anyone with read access to CACHE cannot read raw ATS board responses.
[[kv_namespaces]]
binding = "CACHE"
id = "eed9bc4587124ff8b55ee274a0a2c66e"

# --- KV: raw source-response archive (30-day TTL, per-key expiration).
# Separate namespace created per security review CWE-668 finding: raw
# payloads may contain internal contact info, salary bands, requisition
# notes etc. from upstream ATS boards; keeping them in their own KV
# namespace lets IAM restrict reads to a small ops group and prevents a
# future cache-debug endpoint from echoing raw data.
#
# Provisioned 2026-07-30 via:
#   npx wrangler kv namespace create RAW_PAYLOADS
[[kv_namespaces]]
binding = "RAW_PAYLOADS"
id = "ca20113fb0cf427f87310007f96f2cb5"

# --- KV: append-only abuse/audit event log (14-day TTL).
# Separate namespace per project KV namespacing rule: abuse logs contain
# IP addresses, event timestamps, and route identifiers that should not
# share a namespace with cache data or raw payloads. An IAM policy can
# grant read-only access to just this namespace for abuse-analysis
# operators without leaking facet cache counters or ATS payloads.
#
# Provisioned 2026-07-30 via:
#   npx wrangler kv namespace create ABUSE_LOGS
[[kv_namespaces]]
binding = "ABUSE_LOGS"
id = "4222eb727bff4cec8aee8b2442f71a13"

# --- Queues: decouples the cron scheduler from per-source fetching (see spec 5.2/13.1) ---
[[queues.producers]]
binding = "INGEST_QUEUE"
queue = "hiring-signals-ingest"

[[queues.consumers]]
queue = "hiring-signals-ingest"
max_batch_size = 10
max_batch_timeout = 30

# --- Workers AI: embedding generation for semantic search (Milestone I,
# spec 9.4). Model id lives in [vars] below, not hardcoded, so a future
# model swap is a config change. ---
[ai]
binding = "AI"

# --- Vectorize: job-embedding index for semantic search (spec 9.4).
# Index provisioned out-of-band via `wrangler vectorize create
# hiring-signals-jobs --dimensions=768 --metric=cosine` (768-dim matches
# @cf/baai/bge-base-en-v1.5's output, confirmed against Cloudflare's own
# docs 2026-07-29). Metadata indexes (companyId/roleCategory/
# locationMode/status/postedAt, all string) created before this binding
# was added and before any vectors exist -- Vectorize metadata filters
# only apply to vectors inserted after the metadata index exists, per
# Cloudflare's own docs, so this ordering is load-bearing, not
# incidental. ---
[[vectorize]]
binding = "VECTORIZE"
index_name = "hiring-signals-jobs"
# 2026-08-06 local-testing note: temporarily set remote=true to test
# against the real Vectorize account instead of the unsupported local
# stub (Cloudflare docs confirm Vectorize has no local emulation --
# see this file's other header comment). Writes under this setting
# land in the SAME account-level index production uses (not
# environment-scoped) -- explicit user confirmation obtained before
# enabling. Revert to false/remove before deploying, once local
# ingestion is confirmed stable end-to-end (see ROADMAP.md).
remote = true

# --- Workers Analytics Engine: API-request metrics (spec §16.3
# "monitoring exposes ... API error rates" -- see apps/api/src/
# middleware/api-metrics.ts). Dataset is created automatically on first
# writeDataPoint call after this binding exists, per Cloudflare's own
# docs -- no separate provisioning command needed, unlike Vectorize
# above. No local emulation exists (confirmed against Cloudflare's own
# docs, 2026-08-11): c.env.API_METRICS is undefined under `wrangler
# dev`, which api-metrics.ts's own guard treats as a normal no-op, not
# an error. Querying data back requires the SQL API
# (api.cloudflare.com/client/v4/accounts/<id>/analytics_engine/sql,
# bearer-token authenticated) -- infrastructure/scripts/api-metrics.mjs
# is the ops-facing wrapper around that, following d1-exec.mjs's own
# "ops scripts shell out / call REST directly, they cannot use a live
# Worker binding" precedent. ---
[[analytics_engine_datasets]]
binding = "API_METRICS"
dataset = "hiring_signals_api_metrics"

# Cron routes:
# - */15 * * * *: find due sources and enqueue ingest messages; never fetch providers here.
# - 0 6 * * *: recompute stale active-signal scores; also no provider fetches.
# Real per-source cadence lives in sources.poll_interval_minutes, computed
# from the free-tier budget formula.
[triggers]
crons = ["*/15 * * * *", "0 6 * * *"]

[vars]
# Non-secret config only. Secrets go through `wrangler secret put`.
ENVIRONMENT = "development"
EMBEDDING_MODEL = "@cf/baai/bge-base-en-v1.5"
