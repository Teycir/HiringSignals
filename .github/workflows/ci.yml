# CI: typecheck + lint across every workspace package (ROADMAP.md
# Milestone J CI item). Deliberately does NOT run `pnpm -r test` yet --
# every live test suite in this repo talks to real remote Cloudflare D1
# (packages/test-support's live-d1-client.ts / d1-remote-transport.ts,
# per AGENTS.md's "zero mocks, zero fakes" policy).
#
# Auth is no longer the blocker: the repo's CF_TOKEN was widened
# 2026-08-02 to include D1:Edit (alongside its original Workers AI +
# Vectorize scope, see .env.local.example's header comment) and
# verified working as wrangler's CLOUDFLARE_API_TOKEN against
# production D1. The remaining open question is scope/isolation, not
# credentials: every live suite here writes real rows to the same
# production `hiring-signals` database this app actually serves from,
# and some suites alone run 500-1500s+ against real Cloudflare
# infrastructure. Wiring `pnpm -r test` into this workflow is a
# deliberate, tracked follow-up (see ROADMAP.md Milestone J's CI item)
# pending a decision on test-DB isolation -- not an oversight.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version pinned from this repo's own .nvmrc (24.18.0) -- wrangler
      # requires >=22, and every ops-script/test-support session in this
      # repo has standardized on this exact version.
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      # pnpm version pinned to match package.json's own
      # "packageManager": "pnpm@11.17.0" exactly, so CI installs with
      # the same resolver behavior as local dev.
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (all workspaces)
        run: pnpm -r typecheck

      - name: Lint (all workspaces)
        run: pnpm -r lint
