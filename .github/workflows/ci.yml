# CI: typecheck + lint across every workspace package, plus fast
# pure-logic tests (packages/domain, packages/adapters) on every
# push/PR (ROADMAP.md Milestone J CI item). Deliberately does NOT run
# the live-D1 suites (packages/db, apps/api) here -- every one of those
# talks to real remote Cloudflare D1 (packages/test-support's
# live-d1-client.ts / d1-remote-transport.ts, per AGENTS.md's "zero
# mocks, zero fakes" policy), writes real rows to the same production
# `hiring-signals` database this app actually serves from, and some
# suites alone run 500-1500s+ against real Cloudflare infrastructure.
# For a solo-maintainer project that value doesn't justify that cost
# and risk on every commit -- explicitly discussed and decided
# 2026-08-02, not an oversight. Run those manually/locally
# (`pnpm --filter @hiring-signals/db test`, etc., see AGENTS.md) when
# you actually want that confidence, e.g. before a release.
#
# packages/domain and packages/adapters are the safe, fast exception:
# both are pure logic with zero @hiring-signals/test-support or live-D1
# dependency (confirmed via their package.json dependency lists,
# 2026-08-02) -- domain has none of this repo's own packages as a
# dependency at all, adapters depends only on domain. Their vitest
# suites run in seconds against fixtures/pure functions, so they cost
# nothing extra to run on every push and catch real regressions in
# classification, lifecycle, scoring, and every ATS adapter's
# normalize() logic before merge.
#
# Auth for the live-D1 suites (when run manually) is no longer a
# blocker either way: the repo's CF_TOKEN was widened 2026-08-02 to
# include D1:Edit (alongside its original Workers AI + Vectorize
# scope, see .env.local.example's header comment) and verified working
# as wrangler's CLOUDFLARE_API_TOKEN against production D1.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  fast-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version pinned from this repo's own .nvmrc (24.18.0) -- wrangler
      # requires >=22, and every ops-script/test-support session in this
      # repo has standardized on this exact version.
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      # pnpm version pinned to match package.json's own
      # "packageManager": "pnpm@11.17.0" exactly, so CI installs with
      # the same resolver behavior as local dev.
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (all workspaces)
        run: pnpm -r typecheck

      - name: Lint (all workspaces)
        run: pnpm -r lint

      # Pure-logic suites only -- no live D1/AI/Vectorize, no secrets
      # needed, runs in seconds. See the header comment above for why
      # packages/db and apps/api's live-D1 suites are NOT run here.
      - name: Test (packages/domain)
        run: pnpm --filter @hiring-signals/domain test

      - name: Test (packages/adapters)
        run: pnpm --filter @hiring-signals/adapters test

      # Dependency vulnerability scan (ROADMAP.md Milestone G.1/G.2,
      # spec 14.1's "use dependency scanning; patch critical
      # vulnerabilities promptly"). Warn-only for now (`|| true`): a
      # solo-maintainer project shouldn't have every push go red on a
      # transitive advisory with no available fix, and the actual
      # noise level here isn't known yet. Revisit to fail-on-critical
      # (drop the `|| true`, or gate on `--audit-level=critical`
      # specifically) once a baseline of real vs. noise findings exists.
      - name: Dependency audit (non-blocking)
        run: pnpm audit --audit-level=high || true
